<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub-Admin Preview</title>
<style>
  body { background: #0b0f19; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  h2 { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
  p { color: #8b92a5; font-size: 14px; margin-top: 8px; }
  input { background: #09090b; border: 1px solid #27272a; color: #fff; padding: 14px; border-radius: 10px; width: 100%; margin: 10px 0; font-size: 16px; text-align: center; outline: none; }
  input:focus { border-color: #ef4444; }
  button { background: #ef4444; color: #fff; border: none; padding: 14px 24px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; font-size: 14px; text-transform: uppercase; transition: all 0.2s; margin-top: 10px; }
  button:hover { background: #dc2626; }
  .grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 12px; margin-top: 20px; }
  .box { background: rgba(34,221,119,0.1); border: 1px solid rgba(34,221,119,0.3); border-radius: 12px; padding: 16px; }
  .box .pos { font-size: 11px; color: #8b92a5; font-weight: 700; letter-spacing: 1px; }
  .box .val { font-size: 32px; font-weight: 900; color: #22dd77; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  .err { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
  .success { color: #22dd77; font-size: 13px; margin-top: 10px; display: none; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 10px; background: #27272a; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; }
  .tab.active { background: #ef4444; color: white; }
</style>
</head>
<body>
  <div class="card" id="authCard">
    <h2>🔒 Sub-Admin Access</h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>
    
    <div id="loginForm">
      <input type="text" id="loginPhone" placeholder="Phone Number">
      <input type="password" id="loginPass" placeholder="Password">
      <button onclick="login()">Unlock Preview</button>
      <p class="err" id="loginErr"></p>
    </div>

    <div id="registerForm" class="hidden">
      <input type="text" id="regName" placeholder="Full Name">
      <input type="text" id="regPhone" placeholder="Phone Number">
      <input type="password" id="regPass" placeholder="Create Password">
      <button onclick="register()">Request Access</button>
      <p class="err" id="regErr"></p>
      <p class="success" id="regSuccess"></p>
    </div>
  </div>

  <div class="card hidden" id="dataCard">
    <h2>👁️ Upcoming Rounds</h2>
    <p>Live server preview (Read-Only)</p>
    <div class="grid" id="previewGrid"></div>
    <button onclick="logout()" style="margin-top:24px; background:#27272a;">Lock & Exit</button>
  </div>

  <script>
    let token = localStorage.getItem('subAdminToken');
    if (token) showData();

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
      }
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPass').value.trim();
      if (!name || !phone || !password) return showErr('regErr', 'All fields required');
      
      const r = await fetch('/api/sub-admin/register', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name, phone, password })
      });
      const j = await r.json();
      if (r.ok) {
        document.getElementById('regSuccess').textContent = j.message;
        document.getElementById('regSuccess').style.display = 'block';
        document.getElementById('regErr').style.display = 'none';
      } else {
        showErr('regErr', j.error);
      }
    }

    async function login() {
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      const r = await fetch('/api/sub-admin/login', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ phone, password })
      });
      const j = await r.json();
      if (r.ok) {
        token = j.token;
        localStorage.setItem('subAdminToken', token);
        showData();
      } else {
        showErr('loginErr', j.error);
      }
    }

    async function showData() {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('dataCard').classList.remove('hidden');
      refresh();
      setInterval(refresh, 2000);
    }

    async function refresh() {
      const r = await fetch('/api/sub-admin/preview', { headers: { 'authorization': `Bearer ${token}` } });
      if (r.ok) {
        const j = await r.json();
        document.getElementById('previewGrid').innerHTML = j.upcoming.map(u => `
          <div class="box">
            <div class="pos">ROUND #${u.position}</div>
            <div class="val">${u.crash.toFixed(2)}x</div>
          </div>
        `).join('');
      } else {
        logout();
      }
    }

    function logout() {
      localStorage.removeItem('subAdminToken');
      location.reload();
    }

    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
